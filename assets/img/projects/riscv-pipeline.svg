<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">RISC-V five-stage pipeline</title>
  <desc id="description">Five boxes in a row joined by arrows: instruction fetch, instruction decode, execute, memory access, and writeback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="215" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#111827">RISC-V Pipeline Stages</text>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="600" fill="#111827" text-anchor="middle" stroke-width="3">
    <rect x="120"  y="430" width="200" height="180" rx="18" fill="#dbeef9" stroke="#1f2937"/>
    <text x="220"  y="543">IF</text>
    <rect x="410"  y="430" width="200" height="180" rx="18" fill="#b9d0ee" stroke="#1f2937"/>
    <text x="510"  y="543">ID</text>
    <rect x="700"  y="430" width="200" height="180" rx="18" fill="#9db7e3" stroke="#1f2937"/>
    <text x="800"  y="543">EX</text>
    <rect x="990"  y="430" width="200" height="180" rx="18" fill="#cdc5e8" stroke="#1f2937"/>
    <text x="1090" y="543">MEM</text>
    <rect x="1280" y="430" width="200" height="180" rx="18" fill="#d8d0eb" stroke="#1f2937"/>
    <text x="1380" y="543">WB</text>
  </g>
  <g stroke="#1f2937" stroke-width="5" marker-end="url(#arrow)">
    <line x1="326"  y1="520" x2="400"  y2="520"/>
    <line x1="616"  y1="520" x2="690"  y2="520"/>
    <line x1="906"  y1="520" x2="980"  y2="520"/>
    <line x1="1196" y1="520" x2="1270" y2="520"/>
  </g>
</svg>
